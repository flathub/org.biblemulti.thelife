app-id: org.biblemulti.thelife
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: biblemultithelife
separate-locales: false
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
modules:
  - name: libkeybinder
    buildsystem: autotools
    config-opts:
       - --disable-introspection
    sources:
       - type: archive
         url: https://github.com/kupferlauncher/keybinder/releases/download/keybinder-3.0-v0.3.2/keybinder-3.0-0.3.2.tar.gz
         sha256: e6e3de4e1f3b201814a956ab8f16dfc8a262db1937ff1eee4d855365398c6020
  - name: biblemultithelife
    buildsystem: simple
    build-commands:
       - mkdir -p /app
       - tar -xf biblemultithelife.tar.gz -C /app
       - mkdir -p /app/bin
       - ln -s /app/biblemultithelife /app/bin/biblemultithelife
       - |
         arch=$(uname -m)
         if [ "$arch" = "x86_64" ]; then
           ln -s /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 /app/lib/libsqlite3.so
         elif [ "$arch" = "aarch64" ]; then
           ln -s /usr/lib/aarch64-linux-gnu/libsqlite3.so.0 /app/lib/libsqlite3.so
         fi
    sources:
       - type: file
         url: https://gitlab.com/-/project/17175284/uploads/a2c475def4d655d943367fc57ca3cbd6/biblemultithelife.tar.gz
         sha256: e658bc43822af2ad979376b4f3034708d01dbdcffab588104f52ff985e2c553a
         only-arches: [x86_64]
       - type: file
         url: https://gitlab.com/-/project/17175284/uploads/1a4bc497ee29776f26c805c9a5306d56/biblemultithelife.tar.gz
         sha256: 4e6e607e600e3f4729264522f792f74713100de4fe509d951d4c48bb5f0c7d2d
         only-arches: [aarch64]
